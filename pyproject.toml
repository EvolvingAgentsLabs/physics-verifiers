[project]
name = "physics-verifiers"
version = "0.1.0"
description = "RL environments whose reward is computed by physics: closed forms, conservation laws, observed convergence order, and statistics with known sampling error."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["numpy", "scipy", "sympy", "mpmath"]

[project.optional-dependencies]
# Pinned, and the pin is dated: docs/INTERFACE-NOTES.md records that 0.1.5 is the
# only released API and that the repo's own examples use an unreleased `v1`.
hub = ["verifiers==0.1.5"]
dev = ["pytest", "hypothesis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "adapters"]
